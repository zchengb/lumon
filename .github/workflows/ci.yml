name: Lumon CI

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked development environment
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright --pythonpath .venv/bin/python

      - name: Pytest
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Create distribution checksums
        run: uv run python tools/create_checksums.py dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumon-ci-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
