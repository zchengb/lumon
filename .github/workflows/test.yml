name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full Python test suite
        run: |
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Python syntax and diff checks
        run: |
          python -m compileall -q lib
          git diff --check
      - name: Agent World contract report
        run: |
          PYTHONPATH=lib python lib/scripts/agent_security_cli.py agent-world status --agent ci || true
          PYTHONPATH=lib python lib/scripts/agent_security_cli.py agent-world certify --agent ci --provider codex || true

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        run: |
          npm ci
          npm run build
