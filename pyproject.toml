[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lumon"
dynamic = ["version"]
description = "Lumon Workspace and Agent tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",
    "fastapi>=0.115,<1",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/zchengb/lumon"

[project.scripts]
lumon = "lumon.cli.app:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lumon"]
artifacts = ["src/lumon/dashboard/static"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/lumon/dashboard/static"]

[tool.hatch.version]
path = "src/lumon/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src/lumon", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
